<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maze Run</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0c0e12; color: #e6e9ef; font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; }
      #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
      .screen { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; max-width: 480px; padding: 20px; }
      .hidden { display: none !important; }
      h1 { margin: 0; letter-spacing: 0.04em; }
      button { font: inherit; background: #1c2130; color: #e6e9ef; border: 1px solid #3a4356; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
      button:hover { background: #262c40; }
      button.primary { background: #ffce54; color: #0c0e12; border-color: #ffce54; font-weight: 600; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
      .pick { border: 2px solid transparent; }
      .pick.is-selected { border-color: #ffce54; }
      #game-wrap { position: relative; }
      canvas { display: block; background: #141820; border-radius: 6px; max-width: 90vw; max-height: 70vh; }
      .hud { position: absolute; font: 12px/1.4 ui-monospace, monospace; color: #e6e9ef; background: rgba(12,14,18,0.72); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 6px 10px; pointer-events: none; }
      #hud-top { top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; pointer-events: none; }
      .clock-track { width: 160px; height: 8px; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 8px; }
      .clock-bar { height: 100%; background: #ffce54; width: 100%; }
      #mute-btn { position: absolute; top: 8px; right: 8px; pointer-events: auto; font-size: 11px; padding: 4px 8px; }
      #hud-top #mute-btn { position: static; margin-left: 8px; }
      .dim { color: #8b94a5; font-size: 12.5px; }
      #pause-overlay { position: absolute; inset: 0; background: rgba(12,14,18,0.85); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
